<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14203A"/><stop offset=".7" stop-color="#22355A"/><stop offset="1" stop-color="#2C4268"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A2C"/><stop offset="1" stop-color="#0B111E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2=".55">
      <stop offset="0" stop-color="#FFE7A6" stop-opacity=".95"/><stop offset=".55" stop-color="#F2C35E" stop-opacity=".45"/><stop offset="1" stop-color="#E2B65C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3A4A68"/><stop offset=".45" stop-color="#E9C46F"/><stop offset=".8" stop-color="#F7DB95"/><stop offset="1" stop-color="#E2B65C" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3C9"/><stop offset=".35" stop-color="#FFD97A" stop-opacity=".6"/><stop offset="1" stop-color="#E2B65C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#FFF6DA">
    <circle cx="70" cy="70" r="2.4"/><circle cx="140" cy="40" r="1.6"/><circle cx="210" cy="95" r="2"/><circle cx="300" cy="50" r="1.6"/>
    <circle cx="380" cy="90" r="2.4"/><circle cx="450" cy="45" r="1.8"/><circle cx="470" cy="140" r="1.6"/><circle cx="40" cy="160" r="1.6"/>
  </g>
  <!-- colinas -->
  <path d="M0 330 C90 300 170 315 250 330 C330 345 420 300 512 312 V512 H0Z" fill="url(#hill)"/>
  <!-- caminho -->
  <path d="M40 512 C90 462 150 430 230 412 C320 392 420 360 512 328 L512 348 C430 382 350 410 290 430 C220 452 200 484 240 512Z" fill="url(#path)"/>
  <!-- feixe de luz saindo da Bíblia para o caminho -->
  <path d="M228 258 L512 290 L512 352 L320 428 Z" fill="url(#beam)" opacity=".85"/>
  <circle cx="230" cy="264" r="46" fill="url(#glow)"/>
  <!-- bonequinho caminhando -->
  <g fill="#0A0F1B" stroke="#0A0F1B" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="176" cy="196" r="21" stroke="none"/>
    <path d="M176 222 L170 312" stroke-width="34" fill="none"/>
    <!-- pernas em passo -->
    <path d="M170 308 L196 360 L214 412" stroke-width="20" fill="none"/>
    <path d="M168 308 L152 362 L124 404" stroke-width="20" fill="none"/>
    <path d="M214 412 L232 414" stroke-width="16" fill="none"/>
    <path d="M124 404 L112 396" stroke-width="16" fill="none"/>
    <!-- braço de trás -->
    <path d="M172 236 L150 276 L140 300" stroke-width="15" fill="none"/>
    <!-- braço da frente segurando a Bíblia -->
    <path d="M180 236 L204 266 L222 262" stroke-width="15" fill="none"/>
  </g>
  <!-- Bíblia aberta -->
  <g transform="translate(230 262) rotate(-12)">
    <path d="M-24 -4 Q-12 -12 0 -4 Q12 -12 24 -4 L24 16 Q12 8 0 16 Q-12 8 -24 16Z" fill="#FFF8E4" stroke="#C99A3A" stroke-width="2.5"/>
    <path d="M0 -4 V16" stroke="#C99A3A" stroke-width="2"/>
  </g>
  <!-- contorno de luz no bonequinho -->
  <path d="M190 182 A21 21 0 0 1 196 206" stroke="#F7D98C" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
